[workspace]
resolver = "2"
members = ["crates/quota-core", "src-tauri"]

[workspace.package]
version = "0.25.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` is load-bearing, not a preference: without it serde_json's
# Map is a BTreeMap that re-sorts object keys, so the user's account order is
# destroyed at every JSON boundary (IPC deserialize, config save, event emit)
# even though Config.providers is an IndexMap.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `io-util` (AsyncReadExt/AsyncWriteExt) and `net` (TcpListener/TcpStream) are
# used directly by the LAN pairing transport (quota_core::pairing) and its
# desktop socket adapter, not merely pulled in transitively.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
indexmap = { version = "2", features = ["serde"] }
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
