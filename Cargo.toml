[workspace]
resolver = "2"
members = ["crates/quota-core", "src-tauri"]

[workspace.package]
version = "0.6.4"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` is load-bearing, not a preference: without it serde_json's
# Map is a BTreeMap that re-sorts object keys, so the user's account order is
# destroyed at every JSON boundary (IPC deserialize, config save, event emit)
# even though Config.providers is an IndexMap.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
