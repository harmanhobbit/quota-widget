name: Release

# Publishes a release to TWO repositories (ADR-0005):
#   1. this repo, harmanhobbit/quota-widget — the primary release/update channel
#      now that the source is public. New builds poll its latest.json.
#   2. harmanhobbit/quota-widget-dist — the legacy downloads-only repo, kept as a
#      temporary compatibility mirror so already-installed clients that still
#      poll the old endpoint keep updating. Dual publishing stays on until those
#      clients have migrated.
# Every upload is explicit rather than a glob over the workspace, so a stray
# build product can never become a published asset.
#
# Two tokens, two scopes, and they must not be crossed: the primary release is
# created with the built-in GITHUB_TOKEN (needs `contents: write`, granted on
# the publish job only), which can write releases in *this* repo and nowhere
# else; the mirror release is created with DIST_REPO_TOKEN, whose whole reason
# for existing is that the built-in token cannot write to another repository.
#
# Signing and dist-repo credentials come from CI secrets and nothing here may
# echo them: the source repo is public, so a leaked value would be a leak to
# everyone.
#
# Deliberately separate from build.yml: that workflow's Windows job is metered
# at 2x and already gated to tags/dispatch for *artifacts*. This one is the only
# path that creates a public release, so it must never fire on a branch push.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and generate latest.json but do not publish'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same check build.yml runs, repeated here because a release can be reached by
  # dispatch without build.yml's verify-tag ever having run on this ref.
  verify-tag:
    name: Tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag to workspace version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME declares $tag_version but Cargo.toml is $cargo_version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml $cargo_version"

  test:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Clippy is scoped to quota-core for the same reason the tests are: the
      # src-tauri crate needs the GTK/WebKit system libraries, which this cheap
      # runner deliberately does not install. -D warnings, no crate-wide allows.
      - run: cargo clippy -p quota-core --all-targets -- -D warnings
      - run: cargo test -p quota-core
      - run: npm run check-versions

  # A broken frontend must not reach a signed, published build. Same cheap
  # Linux check build.yml runs, repeated here because a release can be reached
  # by dispatch without build.yml ever having run on this ref.
  frontend:
    name: Frontend build + smoke-mount (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # `vite build` only compiles the components; smoke-mount catches the
      # Svelte 5 runtime throws it misses. jsdom is deliberately not a
      # package.json dependency (an npmDeps.hash regen in nix/package.nix);
      # `--no-save` keeps this ephemeral install out of package.json and the
      # committed lockfile. `--conditions=browser` lives in the npm script.
      - run: npm run build
      - run: npm i -D jsdom --no-save
      - run: npm run smoke-mount

  build-windows:
    name: Signed Windows artifacts
    needs: [verify-tag, test, frontend]
    # verify-tag is skipped on a dispatch, so accept skipped — but never accept
    # a failure. Mirrors build.yml's build-windows gate.
    if: |
      !cancelled() && needs.test.result == 'success'
      && needs.frontend.result == 'success'
      && needs.verify-tag.result != 'failure'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci

      # A release build is never a dev build: QUOTA_WIDGET_BRANCH stays unset so
      # no branch badge is baked in, and update detection stays live.
      - name: Build signed bundle
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The signature is produced by bundle.createUpdaterArtifacts. Fail loudly
      # and specifically if it is missing: the alternative is publishing a
      # manifest whose signature field is empty, which every client rejects with
      # a far less obvious error, days later.
      - name: Stage signed Windows assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          installer=$(ls target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1)
          if [ -z "$installer" ]; then
            echo "::error::no NSIS installer in target/release/bundle/nsis"
            exit 1
          fi
          if [ ! -f "$installer.sig" ]; then
            echo "::error::$installer.sig is missing — is bundle.createUpdaterArtifacts set in tauri.conf.json, and is TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi
          # The portable EXE ships too, for anyone who does not want an
          # installed app. Rename it per-version: release asset names are the
          # download URL, and a bare quota-widget.exe would read identically
          # across every release once saved.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          portable="target/release/QuotaWidget_${version}_x64-portable.exe"
          if [ ! -f target/release/quota-widget.exe ]; then
            echo "::error::no portable EXE at target/release/quota-widget.exe"
            exit 1
          fi
          cp target/release/quota-widget.exe "$portable"
          mkdir -p release-assets
          cp "$installer" "$installer.sig" "$portable" release-assets/

      - name: Upload signed Windows assets
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-assets
          path: release-assets/

  build-linux:
    name: Signed AppImage (Ubuntu 24.04)
    needs: [verify-tag, test, frontend]
    # Pin a specific Ubuntu, never `ubuntu-latest`, so a runner-label change
    # can't silently move the bundled glibc/WebKit base out from under a
    # release. 24.04 replaced the retired 22.04 base (ADR-0004): the AppImage
    # is best-effort with no promised compatibility floor, but which base it is
    # built on stays a deliberate, reviewed choice.
    if: |
      !cancelled() && needs.test.result == 'success'
      && needs.frontend.result == 'success'
      && needs.verify-tag.result != 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install Tauri's Ubuntu 24.04 bundle prerequisites
        run: |
          # Tauri's current WebKitGTK binding requires the 4.1 JavaScriptCore
          # ABI and its libsoup 3 dependency. The 4.0 package leaves both
          # `javascriptcoregtk-4.1.pc` and `libsoup-3.0.pc` unavailable.
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci

      # --bundles overrides the Windows-only default in tauri.conf.json. The
      # updater signature is emitted beside the AppImage by the same configured
      # signing key that produces the NSIS signature.
      - name: Build signed AppImage
        run: npm run tauri build -- --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 24.04 restricts the unprivileged user namespaces linuxdeploy's FUSE
          # mount relies on, so the AppImage tooling can't mount itself on the
          # runner. Extracting instead of mounting is the supported workaround
          # and changes nothing about the produced image.
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Stage signed AppImage
        run: |
          set -euo pipefail
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          if [ -z "$appimage" ]; then
            echo "::error::no AppImage in target/release/bundle/appimage"
            exit 1
          fi
          if [ ! -f "$appimage.sig" ]; then
            echo "::error::$appimage.sig is missing — is bundle.createUpdaterArtifacts set in tauri.conf.json, and is TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi
          mkdir -p release-assets
          cp "$appimage" "$appimage.sig" release-assets/

      - name: Upload signed Linux assets
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-assets
          path: release-assets/

  publish:
    name: Publish releases
    needs: [verify-tag, test, frontend, build-windows, build-linux]
    # `contents: write` is scoped to this job alone (top-level stays read), and
    # only ever used against *this* repo via the built-in GITHUB_TOKEN. The
    # mirror release in the dist repo uses DIST_REPO_TOKEN instead — this
    # permission grant does not, and cannot, reach another repository.
    permissions:
      contents: write
    # Publication is deliberately a separate, cheap Linux job. It cannot begin
    # until both platform-specific builds have produced signed artifacts.
    if: |
      !cancelled() && needs.test.result == 'success'
      && needs.frontend.result == 'success'
      && needs.verify-tag.result != 'failure'
      && needs.build-windows.result == 'success'
      && needs.build-linux.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download signed release assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-*-assets
          path: release-assets
          merge-multiple: true

      # Schema is fixed in docs/plan-updates-and-providers.md, "The latest.json
      # contract". It is tauri-plugin-updater's own format because that plugin
      # consumes this exact file. `version` is bare SemVer: the tag keeps its
      # v, the manifest does not.
      #
      # The Linux key is artifact-qualified — `linux-x86_64-appimage`, which is
      # the `{os}-{arch}-{installer}` form the plugin looks for first. Linux has
      # several mutually exclusive package formats, so a bare `linux-x86_64`
      # would mean a future .deb entry either collides with the AppImage's or
      # silently replaces it, and an AppImage build could be handed a .deb it
      # cannot install. Windows publishes one installer, so its bare key stays.
      - name: Generate latest.json
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          installer=$(find release-assets -maxdepth 1 -type f -name '*-setup.exe' -print -quit)
          appimage=$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          if [ -z "$installer" ] || [ -z "$appimage" ]; then
            echo "::error::signed Windows installer or AppImage was not downloaded"
            exit 1
          fi
          if [ ! -f "$installer.sig" ] || [ ! -f "$appimage.sig" ]; then
            echo "::error::a signed release artifact is missing its signature"
            exit 1
          fi
          # URLs and notes point at the main repo, the primary channel (ADR-0005).
          # The dist repo receives this same manifest as a compatibility mirror;
          # its assets are byte-identical, so a client that fetched the manifest
          # from either repo downloads the same signed files from the main repo.
          windows_url="https://github.com/harmanhobbit/quota-widget/releases/download/$tag/$(basename "$installer")"
          linux_url="https://github.com/harmanhobbit/quota-widget/releases/download/$tag/$(basename "$appimage")"
          # jq -Rs slurps the signature verbatim, so newlines and any quoting in
          # the minisign output survive into valid JSON.
          jq -n \
            --arg version "$version" \
            --arg notes "See https://github.com/harmanhobbit/quota-widget/releases/tag/$tag" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_url "$windows_url" \
            --arg linux_url "$linux_url" \
            --rawfile windows_signature "$installer.sig" \
            --rawfile linux_signature "$appimage.sig" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {signature: $windows_signature, url: $windows_url},
                "linux-x86_64-appimage": {signature: $linux_signature, url: $linux_url}
              }}' \
            > latest.json
          cat latest.json
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "installer_signature=$installer.sig" >> "$GITHUB_OUTPUT"
          echo "portable=$(find release-assets -maxdepth 1 -type f -name '*-portable.exe' -print -quit)" >> "$GITHUB_OUTPUT"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          echo "appimage_signature=$appimage.sig" >> "$GITHUB_OUTPUT"

      # Primary channel (ADR-0005). The tag already exists in this repo — it is
      # what triggered the run — so this attaches a release to it. Uses the
      # built-in GITHUB_TOKEN with the job's `contents: write`; that token can
      # write releases here and only here. Published first so that if the mirror
      # step below ever fails, the channel new builds actually poll is already
      # live.
      - name: Publish release to main repo
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"

          # --repo is this repo explicitly; no cross-repo write is possible with
          # this token. latest.json ships here because this is the manifest new
          # builds fetch from latest/download.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "Quota Widget $tag" \
            "${{ steps.assets.outputs.installer }}" \
            "${{ steps.assets.outputs.installer_signature }}" \
            "${{ steps.assets.outputs.portable }}" \
            "${{ steps.assets.outputs.appimage }}" \
            "${{ steps.assets.outputs.appimage_signature }}" \
            latest.json

      # Compatibility mirror (ADR-0005): the same assets and the same latest.json
      # go to the legacy dist repo so already-installed clients still polling its
      # endpoint keep updating. Dual publishing is temporary; the dist repo is
      # not retired here.
      - name: Publish release to dist repo (compatibility mirror)
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        shell: bash
        env:
          # Scoped to the public dist repo only. The default GITHUB_TOKEN cannot
          # write to another repository, which is the whole reason this exists.
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"

          # The dist repo's landing page is generated from docs/dist-README.md
          # here, so it cannot drift from what is actually being shipped. It is
          # written for downloaders and deliberately is NOT the source repo's
          # README, which documents building a codebase they cannot see.
          # Committed via the API to avoid a second checkout; the sha is
          # required to update an existing file and absent on first publish.
          sha=$(gh api "repos/harmanhobbit/quota-widget-dist/contents/README.md" \
                  --jq .sha 2>/dev/null || true)
          gh api "repos/harmanhobbit/quota-widget-dist/contents/README.md" \
            -X PUT \
            -f message="Update download page for $tag" \
            -f content="$(base64 -w0 < docs/dist-README.md)" \
            ${sha:+-f sha="$sha"} > /dev/null
          echo "dist README published"

          gh release create "$tag" \
            --repo harmanhobbit/quota-widget-dist \
            --title "$tag" \
            --notes "Quota Widget $tag" \
            "${{ steps.assets.outputs.installer }}" \
            "${{ steps.assets.outputs.installer_signature }}" \
            "${{ steps.assets.outputs.portable }}" \
            "${{ steps.assets.outputs.appimage }}" \
            "${{ steps.assets.outputs.appimage_signature }}" \
            latest.json

      # On a dry run, and on any dispatch, the manifest and binaries are still
      # inspectable — you just get them as workflow artifacts instead of a
      # public release. This is the safe way to test the secrets end to end.
      - name: Upload unpublished assets for inspection
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == true }}
        uses: actions/upload-artifact@v6
        with:
          name: release-dry-run
          path: |
            ${{ steps.assets.outputs.portable }}
            latest.json
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.installer_signature }}
            ${{ steps.assets.outputs.appimage }}
            ${{ steps.assets.outputs.appimage_signature }}
