name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same branch — no more
# hand-cancelling half-done Windows builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'src-tauri/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - 'index.html'
              - '.github/workflows/**'

  test:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p quota-core
      # Catches a hardcoded version creeping back in (nix/package.nix once
      # sat a whole release behind); needs no npm install.
      - run: npm run check-versions

  build-windows:
    name: Portable EXE (Windows)
    needs: changes
    # Docs-only pushes skip the expensive (2x-minutes) Windows runner;
    # manual dispatch always builds.
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      # Branch builds carry their ref into both frontend and Rust compilation.
      # Main is deliberately empty: release builds must never look like dev builds.
      - run: npm run tauri build
        env:
          QUOTA_WIDGET_BRANCH: ${{ github.ref_name != 'main' && github.ref_name || '' }}
      - name: Upload portable EXE
        uses: actions/upload-artifact@v6
        with:
          name: quota-widget-portable-${{ github.ref_name }}
          path: target/release/quota-widget.exe
      - name: Upload NSIS installer (optional)
        uses: actions/upload-artifact@v6
        with:
          name: quota-widget-installer-${{ github.ref_name }}
          path: target/release/bundle/nsis/*.exe
