name: Build

on:
  # Every branch runs the cheap Linux tests, so a feature branch is known-green
  # before it is merged into main. Branch pushes cost 1x Linux minutes.
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same branch — no more
# hand-cancelling half-done Windows builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p quota-core
      # Catches a hardcoded version creeping back in (nix/package.nix once
      # sat a whole release behind); needs no npm install.
      - run: npm run check-versions

  # A release tag must name the version the tree actually declares. Catching
  # v0.16.0-on-a-0.15.3-tree here is far cheaper than shipping mislabelled
  # assets, and it runs before the 2x-metered Windows job is allowed to start.
  verify-tag:
    name: Tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag to workspace version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME declares $tag_version but Cargo.toml is $cargo_version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml $cargo_version"

  build-windows:
    name: Portable EXE (Windows)
    needs: [test, verify-tag]
    # Packaging is release-only: an annotated v*.*.* tag, or a deliberate
    # manual dispatch. Ordinary branch and main pushes never reach the Windows
    # runner, which bills at a 2x multiplier against a hand-budgeted quota.
    # verify-tag is skipped on dispatch, so accept its skipped result too.
    if: |
      !cancelled() && needs.test.result == 'success'
      && needs.verify-tag.result != 'failure'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      # Branch builds carry their ref into both frontend and Rust compilation.
      # Tags and main are deliberately empty: release builds must never look
      # like dev builds.
      - name: Resolve branch badge
        id: badge
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "branch=" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run tauri build
        env:
          QUOTA_WIDGET_BRANCH: ${{ steps.badge.outputs.branch }}
      # Keep the actual ref in QUOTA_WIDGET_BRANCH for the on-screen badge,
      # but artifact names reject `/`, which is common in feature branch names.
      - id: artifact-name
        shell: bash
        run: echo "suffix=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload portable EXE
        uses: actions/upload-artifact@v6
        with:
          name: quota-widget-portable-${{ steps.artifact-name.outputs.suffix }}
          path: target/release/quota-widget.exe
      - name: Upload NSIS installer (optional)
        uses: actions/upload-artifact@v6
        with:
          name: quota-widget-installer-${{ steps.artifact-name.outputs.suffix }}
          path: target/release/bundle/nsis/*.exe
      # Only a tag produces public release assets. A manual dispatch still
      # yields the artifacts above, but never publishes a release.
      - name: Attach assets to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/quota-widget.exe
            target/release/bundle/nsis/*.exe
