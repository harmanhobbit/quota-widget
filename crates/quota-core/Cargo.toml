[package]
name = "quota-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
reqwest.workspace = true
tokio.workspace = true
indexmap.workspace = true
futures-util.workspace = true
async-trait = "0.1"
base64 = "0.22"
argon2 = { version = "0.5.3", default-features = false, features = ["password-hash", "alloc"] }
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
rand = "0.8.5"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
sha2 = "0.10"
# `default-features = false` drops the `image` feature (and the `image` crate
# it pulls in) — only SVG rendering is needed, and pure-Rust output keeps this
# light for the Android cross-compile (issue #156).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
# `test-util` enables tokio's paused-time test clock, which lets the pairing
# transport's stall-timeout test fire its 30-second deadline instantly.
tokio = { workspace = true, features = ["test-util"] }
