[package]
name = "quota-widget"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "System-tray widget showing AI provider usage and credits"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quota-core = { path = "../crates/quota-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
dirs = "6"
reqwest.workspace = true
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
futures-util.workspace = true
ksni = "0.3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Android Keystore-backed secret storage. `keyring` 3.x (pinned above for
# Windows) has no Android backend; 4.x restructured around `keyring-core`
# "stores" and ships `android-native-keyring-store`, but its `v1`
# compatibility facade — the obvious `keyring::Entry` to reach for — has no
# `target_os = "android"` arm in its one-time store initializer
# (`keyring-4`/src/v1.rs), so the facade short-circuits to `NoDefaultStore`
# on Android. Depend on the store directly and register it ourselves at
# startup (`secrets::init_store`); the Windows `keyring` 3 and this
# `keyring-core` 1 path never collide in one compiled target, so Cargo
# resolves them independently. `ndk-context` is a direct dependency (not
# merely transitive via the store) because `init_store` must initialize it
# from tao's activity context before `Store::new()` — nothing in the
# tauri/tao/wry stack does that, and `ndk_context::android_context()`
# panics when uninitialized. See `src-tauri/src/secrets.rs`.
[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"
ndk-context = "0.1"
# The Glance home-screen widget host (issue #113) calls into this same shared
# library for the cold read-model projection and its durable refresh, so the
# widget never re-implements a quota decision in Kotlin (ADR-0006). `jni`
# provides the `extern "system"` entry points in `widget_jni.rs`; it is an
# Android-only dependency because that host is the only JNI caller.
jni = "0.21"

# Used directly on Linux so the alert path can call notify-rust's `show_async`,
# which speaks zbus over the existing tokio runtime. Going through
# tauri-plugin-notification's `show()` instead wraps notify-rust's *sync*
# `show()` in `tauri::async_runtime::spawn`, and that sync path calls
# `zbus::block_on` — which, with zbus's `tokio` feature (pulled in by ksni),
# builds a nested multi-thread runtime and panics from inside a tokio worker
# ("Cannot start a runtime from within a runtime"). See `poller::poll_once`.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

# Credential export/import on Android (issue #152). The export file lives
# wherever the user puts it in the system file picker, which on Android hands
# back a content:// URI — unreadable by std::fs. `dialog` provides the picker
# (ACTION_GET_CONTENT / ACTION_CREATE_DOCUMENT); `fs`'s Rust `Fs::open`
# resolves that URI through the ContentResolver into a real fd, so the
# commands in mobile.rs read and write the user's chosen file without the
# webview ever holding a filesystem permission. Mobile-only like the
# commands themselves; desktop's own export path is #151.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Desktop→phone QR transfer (issue #156): the official Tauri camera-scanning
# plugin, same maturity tier as `dialog`/`fs` above. The webview drives
# `scan()`/`cancel()` from its own JS API directly, so mobile.rs only ever
# registers the plugin — no app-defined command wraps it.
tauri-plugin-barcode-scanner = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10.1"
# Native save/open dialogs for the encrypted credential export/import (issue
# #151) — desktop-only, matching how the transfer commands themselves are
# `#[cfg(not(mobile))]`; Android has no export/import path yet.
#
# `xdg-portal` instead of the default `gtk3`: the raw GtkFileChooserWidget
# backend crashes the whole process (SIGABRT, fatal GLib critical out of
# `_gtk_file_chooser_get_settings_for_widget`) on any system whose
# `org.gtk.Settings.FileChooser` GSettings schema doesn't match what this
# build's GTK expects — observed hitting exactly that on a real Linux
# machine the first time the file picker opened. The desktop-portal backend
# asks the session's own file-chooser service over D-Bus instead, so it
# never touches that schema, and it's also what a sandboxed (Flatpak) build
# would need regardless.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[features]
# Enabled by the tauri CLI during `tauri build` and by the Nix package.
# Without it the binary loads the dev-server URL instead of the embedded
# frontend ("Could not connect to localhost").
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "quota_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
