[package]
name = "quota-widget"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "System-tray widget showing AI provider usage and credits"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quota-core = { path = "../crates/quota-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
dirs = "6"
reqwest.workspace = true
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
futures-util.workspace = true
ksni = "0.3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# keyring 3.x (pinned above for Windows) has no Android backend at all; 4.x
# restructured around keyring-core "stores" and adds one
# (`android-native-keyring-store`) reachable through the crate's `v1`
# compatibility facade — a different major version of the same crate name,
# which Cargo resolves independently since Windows and Android builds never
# compile both. See `src-tauri/src/secrets.rs`.
[target.'cfg(target_os = "android")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "android-native-keyring-store"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10.1"

[features]
# Enabled by the tauri CLI during `tauri build` and by the Nix package.
# Without it the binary loads the dev-server URL instead of the embedded
# frontend ("Could not connect to localhost").
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "quota_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
